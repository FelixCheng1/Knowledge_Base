[project]
name = "knowledge-base"
version = "0.1.0"
description = "Add your description here"
# 收紧到 3.13：本地 cu128 wheel 仅提供 cp313 标签，且 .venv 实际为 3.13.13
# 上限 <3.14：本地 wheel 无 cp314 标签，否则 uv universal lock 会因 3.14 无可用 wheel 而失败
# （若需支持 3.11，需另行下载 cp311 的 wheel 或恢复官方源）
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "langchain>=1.2.12",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.2",
    "loguru>=0.7.3",
    "magic-pdf>=1.3.12",
    "minio>=7.2.20",
    "modelscope>=1.35.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pymilvus[model]>=2.6.10",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "regex>=2026.2.28",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "uvicorn>=0.42.0",
    "transformers>=4.57.6",
    "openai-agents>=0.4.2",
    "requests>=2.32.5",
    "rich>=15.0.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true


[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# GPU 版 PyTorch：cu128 索引（RTX 3060，驱动支持 CUDA 12.9，兼容 cu128）
# 注：国内镜像（上交/阿里云）与 uv 索引格式不兼容，改回官方源保证 uv lock/sync 可用
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# torch 系列改为本地 wheel（官方源在本机网络下超时不可用）
# 文件位于 _wheels/，勿删除该目录；如需改回官方源，删掉这几行并恢复 index 配置即可
[tool.uv.sources]
torch = { path = "./_wheels/torch-2.11.0+cu128-cp313-cp313-win_amd64.whl" }
torchaudio = { path = "./_wheels/torchaudio-2.11.0+cu128-cp313-cp313-win_amd64.whl" }
torchvision = { path = "./_wheels/torchvision-0.26.0+cu128-cp313-cp313-win_amd64.whl" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
